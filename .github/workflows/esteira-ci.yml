# Generated by `gh esteira init`. Edit freely; use --force to regenerate.
# TODO(M5): pin every action to a verified full commit SHA.
name: Esteira CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: esteira-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned: v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned: v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # Authoritative gate (S1/S5): local hooks and .esteira/runs records can be
  # bypassed (--no-verify) or forged, so the same gate runs here on the change
  # set. Make this job a required status check in branch protection.
  security-gate:
    runs-on: ubuntu-latest
    env:
      ESTEIRA_REPO: hugoreiis12-png/gh-esteira
      ESTEIRA_REF: a225207fe294e7d27793b47fd50d5fd9f4f9563e # pinned: v0.2.4
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned: v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned: v4
        with:
          node-version: '22'
      - name: Install Esteira (pinned, no secrets)
        run: |
          git init -q "$RUNNER_TEMP/esteira"
          git -C "$RUNNER_TEMP/esteira" fetch -q --depth 1 "https://github.com/$ESTEIRA_REPO.git" "$ESTEIRA_REF"
          git -C "$RUNNER_TEMP/esteira" checkout -q FETCH_HEAD
          echo "ESTEIRA=$RUNNER_TEMP/esteira/cli/src/index.mjs" >> "$GITHUB_ENV"
      # Stage everything since the base so `gate` judges the whole change set.
      # A push that creates a branch sends before=0000…: compare with HEAD~1 then.
      - name: Stage the change set against its base
        run: |
          CHANGE_BASE="$BASE_SHA"
          case "$CHANGE_BASE" in ''|*[!0]*) ;; *) CHANGE_BASE="" ;; esac
          if [ -z "$CHANGE_BASE" ] && git rev-parse --verify -q HEAD~1 >/dev/null 2>&1; then CHANGE_BASE="$(git rev-parse HEAD~1)"; fi
          if [ -z "$CHANGE_BASE" ] || ! git cat-file -e "$CHANGE_BASE^{commit}" 2>/dev/null; then
            echo "::error::Sem commit base para comparar (BASE_SHA='$BASE_SHA')"; exit 1
          fi
          echo "CHANGE_BASE=$CHANGE_BASE" >> "$GITHUB_ENV"
          git reset --soft "$CHANGE_BASE"
      # Policy comes from the base commit, never from the PR being judged.
      - name: Esteira gate (server-side)
        run: node "$ESTEIRA" gate --policy-ref "$CHANGE_BASE"
